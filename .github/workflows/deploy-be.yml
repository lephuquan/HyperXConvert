name: Deploy BE to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-be.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build JAR
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_ECR }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ECR }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: hyperxconvert/springboot-app
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set output for image tag
        id: set-image-tag
        run: echo "image_tag=${{ github.sha }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_SSM }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_SSM }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy BE to EC2 using AWS SSM
        env:
          ECR_REPO: ${{ secrets.ECR_REPO }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DOCKER_PATH: /home/ec2-user
        run: |
          # Định nghĩa script deploy, sử dụng dấu nháy kép để bao quanh.
          # Sẽ thoát (escape) các dấu nháy kép bên trong chuỗi nếu cần.
          DEPLOY_SCRIPT="
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPO
          cd $DOCKER_PATH
          # Cập nhật tag image trong docker-compose.yml trên EC2
          sed -i 's|image: hyperxconvert/springboot-app:.*|image: hyperxconvert/springboot-app:'$IMAGE_TAG'|g' docker-compose.yml
          docker-compose pull
          docker-compose up -d
          docker system prune -f
          "
          # Gửi lệnh qua SSM, sử dụng các tham số rõ ràng thay vì một chuỗi duy nhất
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$'${DEPLOY_SCRIPT}'" \
            --region $AWS_REGION