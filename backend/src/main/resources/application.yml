spring:
  application:
    name: hyperxconvert-backend
  datasource:
    # url: Composition
    username: postgres
    password: HyperX2025!*
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages_vi
    encoding: UTF-8

server:
  port: 8080

aws:
  region: ap-southeast-1
  s3:
    bucket: hyperxconvert-mvp

app:
  upload:
    max-daily-uploads: 5
    presigned-url-expiry: PT24H  # 24 hours