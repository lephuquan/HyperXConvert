# Note:
# - File override này sẽ ghi đè lên file docker-compose.yml
# - Run for overriding: docker compose up

version: '3.8'

services:
  db: # Đây là cấu hình dịch vụ PostgreSQL, không phải cấu hình DB trong application.yml
    image: postgres:16
    container_name: postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HyperX2025!*
      POSTGRES_DB: hyperxconvert
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spring-net

  backend:
    build:
      context: ./
    container_name: springboot-app
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    networks:
      - spring-net

volumes: # dữ liệu DB sẽ không mất khi bạn docker-compose down hay recreate container
  pgdata:

networks:
  spring-net:
