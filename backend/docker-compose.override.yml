# Note:
# - Run for overriding: docker compose up

version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HyperX2025!*
      POSTGRES_DB: hyperxconvert
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spring-net

  backend:
    env_file:
      - ${SPRING_ENV_ACTIVE}  # env.staging / env.prod
    build:
      context: ./
      dockerfile: Dockerfile.dev # Chỉ định Dockerfile.dev để chạy ứng dụng từ source code trên máy local
    volumes:
      - ./:/app # Gắn thư mục máy local vào /app để khi sửa code thì nó sẽ tự động build lại
    container_name: springboot-app
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    networks:
      - spring-net

volumes:
  pgdata:

networks:
  spring-net:
